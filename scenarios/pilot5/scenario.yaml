name: pilot5
description: >-
  Documented subset of the 25-agent Smallville scenario for pilot runs: the official starter trio
  (Isabella Rodriguez, Maria Lopez, Klaus Mueller) plus Sam Moore (candidacy originator) and
  Wolfgang Schulz (frequents Hobbs Cafe; dormmate of Maria and Klaus). All five use the n25
  persona files and n25 history statements. Seeds that mention agents absent from the pilot are
  kept verbatim; those people simply do not exist in this world.
source:
