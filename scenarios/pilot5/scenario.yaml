  history: environment/frontend_server/static_dirs/assets/the_ville/agent_history_init_n25.csv
start: "2023-02-13T00:00:00"
seconds_per_step: 10
map: ../smallville_n25/map/the_ville.json
agents_dir: ../smallville_n25/agents
agents: [isabella_rodriguez, maria_lopez, klaus_mueller, sam_moore, wolfgang_schulz]
events: ../smallville_n25/events.yaml
constraints: ../smallville_n25/constraints.yaml
familiar_public_areas: from each agent's official spatial_memory.json
