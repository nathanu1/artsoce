# Adapted bank for custom scenarios: same 25 questions and placeholders as the reference bank,
# with pronoun-neutral wording for reflection questions 2-4. Use the reference bank to
# reproduce the paper; use this one when the named agents are not all women.
name: appendix_b_adapted
version: 1
source: "Adapted from Park et al. 2023, Appendix B, pp. 21-22"
pronouns: "neutral ('they') for reflection questions 2-4"
questions:
  - {id: self_1, category: self_knowledge, text: "Give an introduction of yourself."}
  - {id: self_2, category: self_knowledge, text: "What's your occupation?"}
  - {id: self_3, category: self_knowledge, text: "What is your interest?"}
  - {id: self_4, category: self_knowledge, text: "Who do you live with?"}
  - {id: self_5, category: self_knowledge, text: "Describe your typical weekday schedule in broad strokes."}
  - {id: memory_1, category: memory, text: "Who is {interacted_1}?"}
  - {id: memory_2, category: memory, text: "Who is {nonexistent_person}?"}
  - {id: memory_3, category: memory, text: "Who is running for the election?"}
  - {id: memory_4, category: memory, text: "Was there a Valentine's day party?"}
  - {id: memory_5, category: memory, text: "Who is {interacted_2}?"}
  - {id: plans_1, category: plans, text: "What will you be doing at 6am today?"}
  - {id: plans_2, category: plans, text: "What will you be doing at 6pm today?"}
  - {id: plans_3, category: plans, text: "What will you have just finished doing at 1pm today?"}
  - {id: plans_4, category: plans, text: "What will you have just finished doing at 12pm today?"}
  - {id: plans_5, category: plans, text: "What will you be doing at 10pm today?"}
  - {id: reactions_1, category: reactions, text: "Your breakfast is burning! What would you do?"}
  - {id: reactions_2, category: reactions, text: "The bathroom is occupied. What would you do?"}
  - {id: reactions_3, category: reactions, text: "You need to cook dinner but your refrigerator is empty. What would you do?"}
  - {id: reactions_4, category: reactions, text: "You see your friend walking by the street. What would you do or say to your friend?"}
  - {id: reactions_5, category: reactions, text: "You see fire on the street. What would you do?"}
  - {id: reflections_1, category: reflections, text: "What inspires you in life the most right now, and why?"}
  - {id: reflections_2, category: reflections, text: "If you had to guess given what you know about {frequent_1}, what book do you think they would like and why?"}
  - {id: reflections_3, category: reflections, text: "If you had to get something {frequent_1} likes for their birthday, what would you get them?"}
  - {id: reflections_4, category: reflections, text: "What would you say to {frequent_1} to compliment them?"}
  - {id: reflections_5, category: reflections, text: "If you could spend time with someone you talked to recently, who would it be and why?"}
