# Offline smoke test: five pilot agents, one simulated morning, deterministic MOCK model and
# hash embeddings. Runs in seconds without credentials. Outcomes are structural only.
#   ga run --config configs/offline_smoke.yaml
run:
  name: smoke
  label: "offline smoke (MOCK)"
scenario:
  path: scenarios/pilot5/scenario.yaml
  start: "2023-02-13T06:00:00"
  end: "2023-02-13T12:00:00"
output:
  checkpoint_every_steps: 180
providers:
  llm: {kind: mock, model: mock-llm-v1}
  embeddings: {kind: mock-hash, model: mock-hash-256, dims: 256}
