# Small LIVE pilot: five agents, two simulated days, Claude via the Anthropic API.
# Needs ANTHROPIC_API_KEY and `pip install -e .[anthropic,local-embeddings]`.
# Run `ga doctor --config configs/live_pilot.yaml` first, then a short slice:
#   ga run --config configs/live_pilot.yaml --set scenario.end=2023-02-13T09:00:00 --yes
# and project the full run from it with `ga experiment --protocol ... --measured-run DIR`.
# The ceilings below stop the run (checkpointed, resumable) before they are crossed.
run:
  name: pilot5-live
  label: "live pilot"
scenario:
  path: scenarios/pilot5/scenario.yaml
  start: "2023-02-13T00:00:00"
  end: "2023-02-15T00:01:00"
providers:
  llm:
    kind: anthropic
    model: claude-opus-5-5
    # Every call reserves room for adaptive thinking plus the JSON answer; only used tokens
    # are billed. Opus 5.5 always thinks; `effort` is the only control.
    max_output_tokens: 4096
    effort: medium
    timeout_s: 180
    max_retries: 2
    # Server-side fallback when a safety classifier refuses (beta). The fallback model is
    # recorded per call in the ledger (served_model). Set "off" to fail the task instead.
    refusal_fallback: default
    task_overrides:
      importance: {effort: low}
      importance_batch: {effort: low}
      choose_location: {effort: low}
      action_grounding: {effort: low}
      interaction_context: {effort: low}
      awareness: {effort: low}
      conversation_summary: {effort: low}
  embeddings:
    # A real local embedding model (download once, or point local_dir at a copy).
    # The released code used OpenAI text-embedding-ada-002; `kind: openai` with
    # model text-embedding-3-small is the closest hosted option (needs OPENAI_API_KEY).
    kind: sentence-transformers
    model: sentence-transformers/all-MiniLM-L6-v2
    dims: null
budget:
  max_calls: 12000
  max_input_tokens: 15000000
  max_output_tokens: 6000000
  max_runtime_s: 43200
  max_cost_usd: 120
  pricing_file: configs/pricing.yaml
