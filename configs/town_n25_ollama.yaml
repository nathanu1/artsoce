# The full town: all 25 Smallville residents with the game layer, on a local model.
# Start here only after the three-agent slice runs well on your machine: 25 residents make
# roughly eight times the calls, so each game hour takes correspondingly longer.
#   ga play --config configs/town_n25_ollama.yaml
run:
  name: town-n25-ollama
  label: "town game, 25 residents (Ollama)"
scenario:
  path: scenarios/smallville_n25/scenario.yaml
  start: "2023-02-13T07:00:00"
  end: "2023-02-15T00:01:00"
output:
  checkpoint_every_steps: 30
game:
  enabled: true
providers:
  llm:
    kind: ollama
    model: llama3.1:8b
    base_url: http://localhost:11434
    num_ctx: 8192
    max_output_tokens: 768
    temperature: 0.7
    keep_alive: 30m
    timeout_s: 600
  embeddings:
    kind: ollama
    model: nomic-embed-text
    dims: 768
    base_url: http://localhost:11434
budget:
  max_calls: 1000000
  max_input_tokens: null
  max_output_tokens: null
