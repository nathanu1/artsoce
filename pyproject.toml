[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "generative-agents-lab"
version = "0.1.0"
description = "Inspectable reproduction of 'Generative Agents: Interactive Simulacra of Human Behavior' (Park et al., UIST 2023) with a headless runner, audited evaluations and a local viewer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "trueskill>=0.4.5",
]

[project.optional-dependencies]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.40"]
local-embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
ga = "generative_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
